name: api-creative

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        restart: unless-stopped
        working_dir: /var/www/html

        volumes:
            - ./:/var/www/html

        networks:
            - creative-network

    nginx:
        image: nginx:stable-alpine
        restart: unless-stopped

        ports:
            - "127.0.0.1:8888:80"

        volumes:
            - ./:/var/www/html:ro
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

        depends_on:
            - app

        networks:
            - creative-network

networks:
    creative-network:
        driver: bridge
